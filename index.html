<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffd5">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Drift</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05010d; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #canvas-wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 18px 20px; pointer-events: none; z-index: 10;
  }
  .pill {
    background: rgba(10, 6, 30, 0.55);
    border: 1px solid rgba(0, 255, 220, 0.35);
    box-shadow: 0 0 18px rgba(0, 255, 220, 0.15), inset 0 0 12px rgba(0,255,220,0.05);
    border-radius: 14px;
    padding: 8px 16px;
    color: #d8fff5;
    font-size: 15px;
    letter-spacing: 0.5px;
    backdrop-filter: blur(6px);
  }
  #score .num { color: #4dfff0; font-weight: 700; font-size: 18px; text-shadow: 0 0 8px #4dfff0; }
  #dist .num { color: #ff5fd6; font-weight: 700; font-size: 18px; text-shadow: 0 0 8px #ff5fd6; }

  #hint {
    position: fixed; bottom: 34px; left: 0; right: 0;
    text-align: center; color: rgba(216,255,245,0.55);
    font-size: 13px; letter-spacing: 1px; pointer-events: none; z-index: 10;
    transition: opacity 0.6s;
  }

  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, rgba(30,10,60,0.92), rgba(3,1,10,0.97));
    text-align: center; padding: 24px;
  }
  #overlay h1 {
    font-size: 42px; letter-spacing: 3px;
    background: linear-gradient(90deg, #4dfff0, #ff5fd6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(77,255,240,0.3);
    margin-bottom: 6px;
  }
  #overlay .sub { color: rgba(216,255,245,0.6); font-size: 14px; margin-bottom: 28px; letter-spacing: 1px; }
  #overlay .msg { color: #fff; font-size: 20px; margin-bottom: 8px; min-height: 28px; }
  #overlay .msg2 { color: rgba(216,255,245,0.5); font-size: 14px; margin-bottom: 30px; }
  #playBtn {
    pointer-events: all;
    background: linear-gradient(135deg, #00ffd5, #ff3fc9);
    border: none; color: #06030f; font-weight: 700; font-size: 17px;
    letter-spacing: 1px; padding: 16px 46px; border-radius: 40px;
    box-shadow: 0 0 30px rgba(0,255,213,0.45), 0 8px 20px rgba(0,0,0,0.4);
    cursor: pointer;
  }
  #playBtn:active { transform: scale(0.96); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="canvas-wrap"><canvas id="game"></canvas></div>

<div id="hud">
  <div class="pill" id="score">ENERJİ <span class="num" id="scoreNum">0</span></div>
  <div class="pill" id="dist">MESAFE <span class="num" id="distNum">0</span>m</div>
</div>

<div id="hint">PARMAĞINI SÜRÜKLE • KAPILARDAN GEÇ</div>

<div id="overlay">
  <h1>NEON DRIFT</h1>
  <div class="sub">DÖNEN TÜNELDE HAYATTA KAL</div>
  <div class="msg" id="msg">Kapılardaki boşluklardan geç</div>
  <div class="msg2" id="msg2">Enerji topla, duvarlara çarpma</div>
  <button id="playBtn">OYNA</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const canvas = document.getElementById('game');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x05010d, 10, 34);

  const camera = new THREE.PerspectiveCamera(66, window.innerWidth/window.innerHeight, 0.1, 100);

  // ---------- lighting ----------
  scene.add(new THREE.AmbientLight(0x6644ff, 0.6));
  const key = new THREE.PointLight(0x00ffe0, 1.2, 20);
  key.position.set(0, 2, 4);
  scene.add(key);
  const rim = new THREE.PointLight(0xff3fc9, 1.1, 18);
  rim.position.set(0, -2, -4);
  scene.add(rim);

  // ---------- tunnel geometry (decorative wireframe) ----------
  const TUNNEL_R = 2.7;
  const tunnelMat = new THREE.MeshBasicMaterial({ color: 0x1a0f3a, wireframe: true, transparent: true, opacity: 0.5 });
  const tunnelGeo = new THREE.CylinderGeometry(TUNNEL_R, TUNNEL_R, 60, 20, 20, true);
  tunnelGeo.rotateX(Math.PI/2);
  const tunnelMesh = new THREE.Mesh(tunnelGeo, tunnelMat);
  tunnelMesh.position.z = -20;
  scene.add(tunnelMesh);

  // ---------- gates (rings with gaps) ----------
  const SEG_COUNT = 10;
  const ANGLE_STEP = (Math.PI*2) / SEG_COUNT;
  const GATE_SPACING = 6;
  const GATE_COUNT = 10;
  const BAND_INNER = 1.5;
  const BAND_OUTER = TUNNEL_R;

  const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1040, emissive: 0x8844ff, emissiveIntensity: 0.5, metalness: 0.5, roughness: 0.4 });
  const gemMat = new THREE.MeshStandardMaterial({ color: 0xffe14d, emissive: 0xffe14d, emissiveIntensity: 0.9, metalness: 0.6, roughness: 0.2 });

  let gates = []; // {z, gapStart(index), pivot(group), gem, gemTaken}

  function buildGate(z){
    const group = new THREE.Group();
    group.position.z = z;
    const gapStartSeg = Math.floor(Math.random()*SEG_COUNT);
    const gapSpan = 2; // number of open segments
    for (let i=0;i<SEG_COUNT;i++){
      const isGap = (i===gapStartSeg || i===((gapStartSeg+1)%SEG_COUNT));
      if (isGap) continue;
      const angle = i*ANGLE_STEP;
      const pivot = new THREE.Group();
      pivot.rotation.z = angle;
      const h = BAND_OUTER - BAND_INNER;
      const w = ANGLE_STEP * ((BAND_INNER+BAND_OUTER)/2) * 0.92;
      const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.35), wallMat);
      box.position.y = (BAND_INNER+BAND_OUTER)/2;
      pivot.add(box);
      group.add(pivot);
    }
    // gem in the gap
    const gapCenterAngle = (gapStartSeg+1)*ANGLE_STEP;
    const gemR = (BAND_INNER+BAND_OUTER)/2;
    const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.26, 0), gemMat);
    gem.position.set(gemR*Math.cos(gapCenterAngle), gemR*Math.sin(gapCenterAngle), 0);
    group.add(gem);

    scene.add(group);
    return { z, gapStartSeg, gapSpan, group, gem, gemTaken:false };
  }

  function resetGates(){
    gates.forEach(g => scene.remove(g.group));
    gates = [];
    for (let i=0;i<GATE_COUNT;i++){
      const z = -14 - i*GATE_SPACING;
      gates.push(buildGate(z));
    }
  }

  function angleNorm(a){
    a = a % (Math.PI*2);
    if (a<0) a += Math.PI*2;
    return a;
  }

  function inGap(theta, gate){
    const t = angleNorm(theta);
    const gapStartAngle = angleNorm(gate.gapStartSeg*ANGLE_STEP);
    const gapEndAngle = angleNorm(gapStartAngle + gate.gapSpan*ANGLE_STEP);
    const margin = 0.12;
    if (gapEndAngle > gapStartAngle){
      return t > gapStartAngle+margin && t < gapEndAngle-margin;
    } else {
      // wraps around 0
      return (t > gapStartAngle+margin) || (t < gapEndAngle-margin);
    }
  }

  // ---------- player ----------
  const PLAYER_R = 2.0;
  const PLAYER_Z = 2;
  let theta = Math.PI/2; // start at top-ish
  let thetaVel = 0;

  const ship = new THREE.Group();
  const shipBody = new THREE.Mesh(
    new THREE.ConeGeometry(0.28, 0.62, 12),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x2fd8ff, emissiveIntensity: 0.7, metalness: 0.4, roughness: 0.25 })
  );
  shipBody.rotation.x = Math.PI/2;
  ship.add(shipBody);
  const shipGlow = new THREE.PointLight(0x4dfff0, 1.3, 5);
  ship.add(shipGlow);
  scene.add(ship);

  // ---------- state ----------
  let state = 'menu';
  let speed = 8;
  let elapsed = 0;
  let score = 0;
  let distance = 0;
  let bobT = 0;
  let dragging = false;
  let lastDragX = 0;

  const scoreNum = document.getElementById('scoreNum');
  const distNum = document.getElementById('distNum');
  const overlay = document.getElementById('overlay');
  const msg = document.getElementById('msg');
  const msg2 = document.getElementById('msg2');
  const playBtn = document.getElementById('playBtn');
  const hint = document.getElementById('hint');

  function startGame(){
    resetGates();
    theta = Math.PI/2;
    thetaVel = 0;
    speed = 8;
    score = 0; distance = 0; elapsed = 0;
    scoreNum.textContent = '0';
    distNum.textContent = '0';
    overlay.classList.add('hidden');
    hint.style.opacity = '1';
    state = 'playing';
  }

  function gameOver(){
    state = 'dead';
    msg.textContent = 'Çarptın!';
    msg2.textContent = 'Enerji: ' + score + '  •  Mesafe: ' + Math.floor(distance) + 'm';
    playBtn.textContent = 'TEKRAR DENE';
    overlay.classList.remove('hidden');
  }

  function tryFullscreen(){
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) { try { req.call(el).catch(()=>{}); } catch(e){} }
  }

  playBtn.addEventListener('click', () => {
    tryFullscreen();
    startGame();
  });

  // ---------- input ----------
  function onDown(x){ dragging = true; lastDragX = x; }
  function onMove(x){
    if (!dragging) return;
    const dx = x - lastDragX;
    lastDragX = x;
    thetaVel -= dx * 0.012;
  }
  function onUp(){ dragging = false; }

  canvas.addEventListener('touchstart', e => { onDown(e.touches[0].clientX); }, {passive:true});
  canvas.addEventListener('touchmove', e => { onMove(e.touches[0].clientX); }, {passive:true});
  canvas.addEventListener('touchend', onUp);
  canvas.addEventListener('mousedown', e => onDown(e.clientX));
  window.addEventListener('mousemove', e => onMove(e.clientX));
  window.addEventListener('mouseup', onUp);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- loop ----------
  let lastT = performance.now();
  function animate(now){
    requestAnimationFrame(animate);
    const dt = Math.min((now-lastT)/1000, 0.05);
    lastT = now;
    bobT += dt;

    tunnelMesh.rotation.z += dt*0.05;

    if (state === 'playing') {
      elapsed += dt;
      speed = 8 + elapsed*0.13;
      distance += speed*dt*0.5;
      distNum.textContent = Math.floor(distance);

      thetaVel *= 0.85;
      theta += thetaVel;

      ship.position.set(PLAYER_R*Math.cos(theta), PLAYER_R*Math.sin(theta), PLAYER_Z);
      ship.rotation.z = theta - Math.PI/2 + Math.sin(bobT*6)*0.03;

      const scrollAmt = speed*dt;
      for (const g of gates){
        g.group.position.z += scrollAmt;
        g.gem.rotation.y += dt*3;
      }

      // recycle gates that passed camera
      for (const g of gates){
        if (g.group.position.z > 6){
          scene.remove(g.group);
          const minZ = Math.min(...gates.map(o=>o.group.position.z));
          const idx = gates.indexOf(g);
          gates[idx] = buildGate(minZ - GATE_SPACING*GATE_COUNT/GATE_COUNT - GATE_SPACING*(GATE_COUNT-1));
        }
      }
      // simpler recycle: keep spacing consistent by placing new gate behind the farthest one
      for (const g of gates){
        if (g.group.position.z > 6 && !g._recycled){
          g._recycled = true;
        }
      }

      // gem collection
      for (const g of gates){
        if (!g.gemTaken && Math.abs(g.group.position.z - PLAYER_Z) < 0.6){
          const gemWorldX = g.gem.position.x;
          const gemWorldY = g.gem.position.y;
          const dx2 = gemWorldX - ship.position.x;
          const dy2 = gemWorldY - ship.position.y;
          if (dx2*dx2 + dy2*dy2 < 0.4){
            g.gemTaken = true;
            g.gem.visible = false;
            score += 1;
            scoreNum.textContent = score;
          }
        }
      }

      // collision check
      for (const g of gates){
        if (Math.abs(g.group.position.z - PLAYER_Z) < 0.35 && !g._checked){
          g._checked = true;
          if (!inGap(theta, g)){
            gameOver();
          }
        }
        if (g.group.position.z - PLAYER_Z > 1) g._checked = false;
      }

      camera.position.set(0, 0, PLAYER_Z + 6);
      camera.lookAt(ship.position.x*0.3, ship.position.y*0.3, PLAYER_Z - 8);
      key.position.set(ship.position.x, ship.position.y, PLAYER_Z+2);
    } else {
      camera.position.set(Math.sin(bobT*0.15)*1.2, Math.cos(bobT*0.15)*1.2, 8);
      camera.lookAt(0,0,-6);
    }

    renderer.render(scene, camera);
  }

  resetGates();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
